<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="./src/assets/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="./src/assets/logo.png"
    />

    <!-- =====================================================
         VIEWPORT
    ====================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         BASIC SEO
    ====================================================== -->

    <title>
      CryptoMintX — Trade, Manage & Explore Digital Assets
    </title>

    <meta
      name="description"
      content="CryptoMintX is a focused platform for exploring markets, managing digital assets and trading crypto."
    />

    <meta
      name="keywords"
      content="CryptoMintX, crypto, cryptocurrency, digital assets, crypto trading, markets, USDT"
    />

    <meta
      name="author"
      content="CryptoMintX"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://cryptomintx.co.in/"
    />

    <!-- =====================================================
         OPEN GRAPH
         Used by WhatsApp, Facebook, Telegram, LinkedIn,
         Discord and many other link previews.
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://cryptomintx.co.in/"
    />

    <meta
      property="og:title"
      content="CryptoMintX — Trade, Manage & Explore Digital Assets"
    />

    <meta
      property="og:description"
      content="Explore crypto markets, manage your digital assets and experience CryptoMintX."
    />

    <meta
      property="og:image"
      content="https://cryptomintx.co.in/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="CryptoMintX — Digital Asset Platform"
    />

    <meta
      property="og:site_name"
      content="CryptoMintX"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="CryptoMintX — Trade, Manage & Explore Digital Assets"
    />

    <meta
      name="twitter:description"
      content="Explore crypto markets, manage your digital assets and experience CryptoMintX."
    />

    <meta
      name="twitter:image"
      content="https://cryptomintx.co.in/og-image.png"
    />

    <!-- =====================================================
         THEME
    ====================================================== -->

    <meta
      name="theme-color"
      content="#05070A"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- =====================================================
         MOBILE WEB APP
    ====================================================== -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="CryptoMintX"
    />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
